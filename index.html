<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Taiwan Way Cafe iPad</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #f7f0e8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .page {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
  }

  .page.active { display: flex; animation: fadeIn 0.25s ease; }

  .stage {
    position: relative;
    width: min(100vw, calc(100vh * 1448 / 1086));
    height: min(100vh, calc(100vw * 1086 / 1448));
  }

  .stage img {
    width: 100%;
    height: 100%;
    display: block;
  }

  .contain-page {
    width: 100%;
    height: 100%;
    background: #fbf7f0;
    border: 1px solid rgba(60, 42, 27, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .contain-page img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .tap-zone {
    position: absolute;
    z-index: 5;
    border: 0;
    background: transparent;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.15s, box-shadow 0.15s, transform 0.15s;
  }

  .tap-zone:active {
    background: rgba(139, 90, 43, 0.10);
    box-shadow: inset 0 0 0 3px rgba(155, 36, 32, 0.18);
    transform: scale(0.985);
  }

  /* === Home page tap zones (新ipad 首頁.png) === */
  #btn-home-desserts        { left: 3.5%;  top: 42.0%; width: 24.0%; height: 17.5%; }
  #btn-home-tea-drinks      { left: 28.5%; top: 42.0%; width: 24.0%; height: 17.5%; }
  #btn-home-custom-cake     { left: 3.5%;  top: 60.5%; width: 24.0%; height: 17.5%; }
  #btn-home-taiwanese-favs  { left: 28.5%; top: 60.5%; width: 24.0%; height: 17.5%; }
  #btn-home-review          { left: 2.5%;  top: 90.5%; width: 27.0%; height: 7.5%; }
  #btn-home-follow          { left: 70.0%; top: 90.5%; width: 27.5%; height: 7.5%; }

  /* === Common: Top-left Back / Top-right Home pill buttons (baked in image) === */
  .btn-page-back { left: 1.5%; top: 2.5%; width: 12.5%; height: 6.5%; }
  .btn-page-home { left: 86.0%; top: 2.5%; width: 12.5%; height: 6.5%; }

  /* === Review / Follow page: Back to Menu pill (bottom center) === */
  .btn-back-to-menu { left: 28.0%; top: 87.0%; width: 44.0%; height: 11.0%; }

  /* === Taiwanese Favorites category tap zones === */
  #btn-tf-braised-pork  { left: 3.5%;  top: 38.0%; width: 28.0%; height: 19.5%; }
  #btn-tf-beef-noodle   { left: 33.0%; top: 38.0%; width: 28.0%; height: 19.5%; }
  #btn-tf-sakura        { left: 3.5%;  top: 60.0%; width: 28.0%; height: 19.5%; }
  #btn-tf-chicken       { left: 33.0%; top: 60.0%; width: 28.0%; height: 19.5%; }
  #btn-tf-review        { left: 2.5%;  top: 90.5%; width: 27.0%; height: 7.5%; }
  #btn-tf-follow        { left: 70.0%; top: 90.5%; width: 27.5%; height: 7.5%; }

  /* === Tea & Drinks category tap zones === */
  #btn-td-bubble-tea { left: 3.5%;  top: 56.0%; width: 28.0%; height: 26.0%; }
  #btn-td-hot-tea    { left: 33.0%; top: 56.0%; width: 28.0%; height: 26.0%; }

  /* === Custom Cake inline tap zones (existing) === */
  #btn-cake-flavors-inline { left: 6.5%;  top: 85.1%; width: 23.8%; height: 6.2%; }
  #btn-cake-order-inline   { left: 32.6%; top: 85.1%; width: 18.8%; height: 6.2%; }

  .back-btn {
    position: absolute;
    bottom: 3%;
    right: 2%;
    z-index: 10;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 0;
    background: rgba(139, 90, 43, 0.86);
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  .countdown-bar {
    position: absolute;
    left: 0;
    bottom: 0;
    z-index: 20;
    height: 4px;
    background: rgba(139, 90, 43, 0.5);
    border-radius: 0 2px 2px 0;
  }

  .attract-overlay {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background-color: #f7f0e8;
    background-image: var(--slide-background);
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
  }

  .attract-overlay.active { display: flex; }

  .attract-panel {
    position: relative;
    width: 100vw;
    height: 100vh;
    padding: 0 62px 58px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    pointer-events: none;
  }

  .tap-pill {
    width: max-content;
    margin-left: auto;
    border: 1px solid rgba(155, 36, 32, 0.34);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.86);
    color: #9b2420;
    font-size: 22px;
    font-weight: 700;
    padding: 16px 26px;
    animation: pulse 2s ease-in-out infinite;
    box-shadow: 0 10px 30px rgba(55, 35, 20, 0.14);
    pointer-events: auto;
  }

  .slide-dots {
    position: absolute;
    left: 62px;
    bottom: 72px;
    display: flex;
    gap: 12px;
  }

  .slide-dot {
    width: 42px;
    height: 5px;
    border-radius: 999px;
    background: rgba(36, 24, 18, 0.22);
  }

  .slide-dot.active { background: #9b2420; }

  @keyframes pulse {
    0%, 100% { opacity: 0.72; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>

    <div class="slide-dots" aria-hidden="true" id="slide-dots"></div>

<script>
  const AUTO_RETURN = 20000;
  const IDLE_TIME = 30000;
  const SLIDE_TIME_PHOTO = 5500;
  const SLIDE_TIME_INFO = 11000;
  const SLIDE_TIME_FEATURE = 15000;
  const V = '?v=20260512';
  const attractSlides = [
    { image: 'url("新ipad 首頁.png' + V + '")',         duration: SLIDE_TIME_INFO    },
    { image: 'url("Taiwanese Favorites.png' + V + '")',  duration: SLIDE_TIME_INFO    },
    { image: 'url("滷肉飯介紹.png' + V + '")',           duration: SLIDE_TIME_FEATURE },
    { image: 'url("牛肉麵介紹.png' + V + '")',           duration: SLIDE_TIME_FEATURE },
    { image: 'url("櫻花蝦油飯說明.png' + V + '")',       duration: SLIDE_TIME_FEATURE },
    { image: 'url("雞肉飯說明.png' + V + '")',           duration: SLIDE_TIME_FEATURE },
    { image: 'url("tea drinks.png' + V + '")',           duration: SLIDE_TIME_INFO    },
    { image: 'url("珍奶內頁.png' + V + '")',             duration: SLIDE_TIME_FEATURE },
    { image: 'url("高山烏龍內頁.png' + V + '")',         duration: SLIDE_TIME_INFO    },
    { image: 'url("鳳梨酥內頁.png' + V + '")',           duration: SLIDE_TIME_FEATURE },
    { image: 'url("草莓蛋糕.png' + V + '")',             duration: SLIDE_TIME_PHOTO   },
    { image: 'url("cake home 橫式.png' + V + '")',       duration: SLIDE_TIME_INFO    },
    { image: 'url("page-42拷貝.png' + V + '")',          duration: SLIDE_TIME_PHOTO   },
    { image: 'url("page-43拷貝.png' + V + '")',          duration: SLIDE_TIME_PHOTO   },
    { image: 'url("page-44拷貝.png' + V + '")',          duration: SLIDE_TIME_PHOTO   },
    { image: 'url("page-45拷貝.png' + V + '")',          duration: SLIDE_TIME_PHOTO   },
    { image: 'url("page-46拷貝.png' + V + '")',          duration: SLIDE_TIME_PHOTO   },
    { image: 'url("page-47拷貝.png' + V + '")',          duration: SLIDE_TIME_PHOTO   },
    { image: 'url("page-48拷貝.png' + V + '")',          duration: SLIDE_TIME_PHOTO   },
    { image: 'url("Review.png' + V + '")',               duration: SLIDE_TIME_INFO    },
    { image: 'url("Follow.png' + V + '")',               duration: SLIDE_TIME_INFO    }
  ];

  (function buildDots() {
    const dotsEl = document.getElementById('slide-dots');
    for (let i = 0; i < attractSlides.length; i++) {
      const dot = document.createElement('div');
      dot.className = 'slide-dot' + (i === 0 ? ' active' : '');
      dotsEl.appendChild(dot);
    }
  })();

  let returnTimer = null;
  let idleTimer = null;
  let attractTimer = null;
  let activeSlide = 0;

  function goTo(pageId) {
    clearTimeout(returnTimer);
    resetIdle();

    document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
    const page = document.getElementById(pageId);
    void page.offsetWidth;
    page.classList.add('active');

    if (pageId !== 'page-home') {
      startCountdown(pageId);
    }
  }

  function startCountdown(pageId) {
    const barId = 'bar-' + pageId.replace('page-', '');
    const bar = document.getElementById(barId);
    if (!bar) return;

    bar.style.transition = 'none';
    bar.style.width = '100%';
    void bar.offsetWidth;
    bar.style.transition = 'width ' + (AUTO_RETURN / 1000) + 's linear';
    bar.style.width = '0%';

    returnTimer = setTimeout(() => goTo('page-home'), AUTO_RETURN);
  }

  function resetIdle() {
    clearTimeout(idleTimer);
    hideAttract();
    idleTimer = setTimeout(showIdle, IDLE_TIME);
  }

  function showIdle() {
    goTo('page-home');
    showAttract();
  }

  function wakeUp() {
    hideAttract();
    resetIdle();
  }

  function showAttract() {
    clearTimeout(attractTimer);
    setSlide(activeSlide);
    document.getElementById('attract-overlay').classList.add('active');
    scheduleNextSlide();
  }

  function hideAttract() {
    clearTimeout(attractTimer);
    document.getElementById('attract-overlay').classList.remove('active');
  }

  function nextSlide() {
    activeSlide = (activeSlide + 1) % attractSlides.length;
    setSlide(activeSlide);
    scheduleNextSlide();
  }

  function scheduleNextSlide() {
    clearTimeout(attractTimer);
    attractTimer = setTimeout(nextSlide, attractSlides[activeSlide].duration);
  }

  function setSlide(index) {
    const slide = attractSlides[index];
    const overlay = document.getElementById('attract-overlay');
    overlay.style.setProperty('--slide-background', slide.image);
    document.querySelectorAll('.slide-dot').forEach((dot, dotIndex) => {
      dot.classList.toggle('active', dotIndex === index);
    });
  }

  document.addEventListener('touchstart', () => {
    if (!document.getElementById('attract-overlay').classList.contains('active')) {
      resetIdle();
    }
  }, { passive: true });
  document.addEventListener('click', resetIdle);

  setSlide(0);
  showAttract();
  idleTimer = setTimeout(showIdle, IDLE_TIME);

  // ===== Swipe support =====
  function attachSwipe(el, onLeft, onRight) {
    let startX = 0, startY = 0, startT = 0;
    el.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      startX = t.clientX;
      startY = t.clientY;
      startT = Date.now();
    }, { passive: true });
    el.addEventListener('touchend', (e) => {
      const t = e.changedTouches[0];
      const dx = t.clientX - startX;
      const dy = t.clientY - startY;
      const dt = Date.now() - startT;
      if (dt > 600) return;          // 太慢不算 swipe
      if (Math.abs(dx) < 50) return; // 距離太短不算
      if (Math.abs(dy) > Math.abs(dx)) return; // 垂直滑動不處理
      if (dx < 0) onLeft(); else onRight();
    }, { passive: true });
  }

  // A. 輪播模式滑動：左滑下一張、右滑上一張
  attachSwipe(
    document.getElementById('attract-overlay'),
    () => { activeSlide = (activeSlide + 1) % attractSlides.length; setSlide(activeSlide); scheduleNextSlide(); },
    () => { activeSlide = (activeSlide - 1 + attractSlides.length) % attractSlides.length; setSlide(activeSlide); scheduleNextSlide(); }
  );

  // B. 同分類內滑動：循環瀏覽該分類所有子頁
  const categorySequences = {
    taiwaneseFavorites: ['page-braised-pork', 'page-beef-noodle', 'page-sakura-shrimp', 'page-chicken-rice'],
    teaDrinks: ['page-bubble-tea', 'page-hot-tea']
  };

  function swipeInCategory(currentPageId, direction) {
    for (const seq of Object.values(categorySequences)) {
      const idx = seq.indexOf(currentPageId);
      if (idx !== -1) {
        const newIdx = direction === 'next'
          ? (idx + 1) % seq.length
          : (idx - 1 + seq.length) % seq.length;
        goTo(seq[newIdx]);
        return;
      }
    }
  }

  Object.values(categorySequences).flat().forEach(pageId => {
    const el = document.getElementById(pageId);
    if (el) {
      attachSwipe(el,
        () => swipeInCategory(pageId, 'next'),
        () => swipeInCategory(pageId, 'prev')
      );
    }
  });
</script>

</body>
</html>
